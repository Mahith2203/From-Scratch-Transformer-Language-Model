[project]
name = "sprintlm"
version = "0.2.0"
description = "A tiny GPT trained from scratch, with ablations and KV-cached inference"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "tiktoken>=0.6",
    "datasets>=2.18",
    "omegaconf>=2.3",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sprintlm"]
